# Multi-node slave package for PYLONTECH CAN BMS.
# Reads BMS data via:
#   - CAN bus    : SOC, voltage, current, CCL/DCL, alarms (frame 0x351 / 0x355 / 0x356 / 0x359)
#   - RS485 UART : individual cell voltages (min/max) for dynamic CVL
# Serves all data to master node via modbus server (bms_modbus_server.yaml).
#
# Required vars (pass via !include vars:):
#   bms_id              - unique BMS number (e.g. '1')
#   bms_name            - display name (e.g. 'PYLONTECH')
#   bms_cell_ovp        - cell over-voltage protection (e.g. '3.550')
#   bms_cell_uvp        - cell under-voltage protection (e.g. '2.800')
#   bms_balance_trigger_voltage - balance delta threshold (e.g. '0.010')
#   pylon_rs485_uart_id - UART id for RS485 cell voltage polling (e.g. 'uart_esp_1')

substitutions:
  bms_model: "PYLONTECH CAN"
  bms_protocol: "Multi-node"

packages:
  bms_sensors: !include bms_sensors_PYLON_CAN.yaml
  bms_combine: !include bms_modbus_server.yaml
